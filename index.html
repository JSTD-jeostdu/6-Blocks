<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon-64.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F7F3EC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A1D24" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="6 Blocks" />
    <title>6 Blocks — 하루 6가지 중요한 일</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
    <style>
      /* 인앱 퍼스트페인트 스플래시 (UX Audit §3.4) — 앱 마운트 시 300ms 페이드아웃, 이후 제거 */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #F7F3EC;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding-bottom: 12vh; /* 마크를 화면 중앙보다 살짝 위로 (컨셉 v2 배치) */
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      #app-splash .splash-tagline {
        margin-top: -14px;
        font-size: 14px;
        font-weight: 500;
        color: #888888;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="17" y="16.2" width="30" height="3.85" rx="1.93" fill="#5A6472"/>
        <rect x="17" y="21.7" width="30" height="3.85" rx="1.93" fill="#3B4D8C"/>
        <rect x="17" y="27.2" width="30" height="3.85" rx="1.93" fill="#D49A3A"/>
        <rect x="17" y="32.7" width="30" height="3.85" rx="1.93" fill="#6E8B6A"/>
        <rect x="17" y="38.2" width="30" height="3.85" rx="1.93" fill="#7B4B6E"/>
        <rect x="17" y="43.7" width="30" height="3.85" rx="1.93" fill="#232A3E"/>
      </svg>
      <div style="font-family: 'Manrope', 'Noto Sans KR', -apple-system, sans-serif; font-size: 30px; font-weight: 800; color: #1A1A1A; letter-spacing: -0.01em;">6 Blocks</div>
      <div class="splash-tagline" style="font-family: 'Manrope', 'Noto Sans KR', -apple-system, sans-serif;">하루 6가지 중요한 일</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
